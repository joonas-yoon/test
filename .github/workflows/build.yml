name: Build

on:
  push:
    branches: '**'
  workflow_dispatch:

jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, '[build]') }}
    runs-on: ubuntu-latest

    steps:
    - id: checkout
      uses: actions/checkout@v2

    - id: build
      run: |
        echo "`date "+%Y-%m-%d %H:%M"`" > date.txt
        git add date.txt
        git commit -m ":zap: build at `date "+%Y-%m-%d %H:%M"`" && git push
        
  print:
    if: ${{ contains(github.event.head_commit.message, '[print]') }}
    runs-on: ubuntu-latest
    steps:
    - id: see
      run: echo "This action was run..!"
